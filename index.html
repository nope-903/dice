<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROLLING DICE</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">

    <meta property="og:title" content="🎲 ROLLING DICE">
    <meta property="og:description" content="TRPG 및 커뮤니티용 커스텀 주사위를 굴리고 결과를 확인해보세요!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1517554558231-1e967a5b3a62?q=80&w=600&auto=format&fit=crop">
    <meta property="og:url" content="https://nope-903.github.io/dice">
    <meta property="og:type" content="website">

    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"></script>
    <script>
        Kakao.init('c0d501bbd271a9800acbc4c63c9b75e8');
    </script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            padding: 5vh 20px; 
            background-color: #f7f7f5; 
            color: #37352f; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow-x: hidden; 
        }
        
        .app-container { 
            width: 100%; 
            max-width: 450px; 
            background: #ffffff; 
            padding: 35px 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            text-align: center; 
            border: 1px solid #e9e9e7;
            margin: 0 auto; 
        }

        .title {
            margin-top: 0; 
            font-size: 1.6rem; 
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 30px;
            word-break: keep-all;
            color: #2c2c2c;
        }

        /* 입력 그룹 정렬 개선 */
        .input-group {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            gap: 15px; /* 라벨과 입력창 사이의 고정 간격 */
        }

        /* 라벨의 너비를 고정하여 입력창이 일렬로 정렬되도록 함 */
        .input-group label {
            text-align: left;
            font-weight: 600;
            color: #555;
            flex: 0 0 135px; /* 라벨이 차지하는 공간을 135px로 고정 */
            white-space: nowrap;
        }
        
        input[type="text"], input[type="number"] { 
            flex: 1; /* 남은 공간을 모두 차지하도록 함 */
            width: 100%;
            padding: 12px; 
            border: 1px solid #d4d4d4; 
            border-radius: 8px; 
            font-size: 16px; 
            text-align: center; 
            outline: none; 
            transition: all 0.2s;
            background: #fafaf8;
        }
        input:focus { border-color: #2eaadc; background: #fff; box-shadow: 0 0 0 2px rgba(46, 170, 220, 0.2); }
        
        .checkbox-container {
            margin: 25px 0 15px 0; 
            font-size: 0.9rem; 
            color: #666;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            cursor: pointer;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2eaadc;
        }
        
        #dice-result {
            font-size: 4.5rem; 
            font-weight: 800; 
            margin: 10px 0; 
            color: #222;
        }

        #judgment-result {
            font-size: 1.1rem; 
            font-weight: bold; 
            min-height: 30px; 
            margin-bottom: 25px; 
            color: #999;
            line-height: 1.5;
        }

        button.action-btn { 
            background: #f1f1ef; 
            color: #37352f; 
            border: 1px solid #e0e0ce; 
            border-radius: 8px; 
            padding: 15px 20px; 
            font-size: 1.05rem; 
            cursor: pointer; 
            transition: all 0.2s; 
            margin-top: 12px; 
            width: 100%; 
            font-weight: 600;
            -webkit-tap-highlight-color: transparent;
        }
        button.action-btn:active { background: #e0e0de; transform: scale(0.98); }
        button.action-btn:hover { background: #eaeaea; }
        
        button#kakao-share-btn { 
            background-color: #fee500 !important; 
            border-color: #fee500 !important;
            color: #000 !important; 
        }
        button#kakao-share-btn:hover { background-color: #ffd900 !important; }
    </style>
</head>

<body> 
    <div class="app-container">
        <h1 class="title">🎲 ROLLING DICE</h1>
        
        <!-- 주사위 종류/수식 입력 칸 -->
        <div class="input-group">
            <label for="dice-type">주사위 또는 수식</label>
            <input type="text" id="dice-type" value="1d100" placeholder="예: 1d100+10, 3*15">
        </div>

        <!-- 기능/특성(선택입력) 입력 칸 -->
        <div class="input-group">
            <label for="target-value">기능/특성 (선택입력)</label>
            <input type="number" id="target-value" placeholder="예: 50" min="1">
        </div>

        <label class="checkbox-container">
            <input type="checkbox" id="show-time-chk" checked>
            주사위 굴린 시간 기록하기
        </label>

        <div id="dice-result">?</div>
        <div id="judgment-result">결과 대기 중...</div>
        
        <button class="action-btn" onclick="rollDice()">주사위 굴리기</button>
        <button class="action-btn" id="copy-result-btn" onclick="copyResultText()" style="display: none;">결과 복사하기</button>
        <button class="action-btn" id="kakao-share-btn" onclick="shareToKakao()" style="display: none;">카카오톡 공유하기</button>
    </div>

    <script>
        let currentResult = 0;
        let maxDice = 100;
        let diceInputStr = '1d100';
        let judgmentText = '';
        let currentTargetValue = '';
        let rolledTimeText = ''; 

        function getFormattedTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}/${month}/${day} ${hours}:${minutes}`;
        }

        function rollDice() {
            let rawInput = document.getElementById('dice-type').value.trim();
            if (!rawInput) {
                rawInput = '1d100';
                document.getElementById('dice-type').value = '1d100';
            }

            if (/[^0-9dD\+\-\*\/\(\)\s]/.test(rawInput)) {
                alert("입력 오류: 올바른 주사위 기호나 수식이 아닙니다.\n(숫자, 주사위 기호(d/D), 기본 연산자(+, -, *, /)만 입력 가능합니다.)");
                return;
            }

            if (/d(?![0-9])/i.test(rawInput)) {
                alert("입력 오류: 주사위 기호 'd' 또는 'D' 뒤에는 반드시 숫자를 입력해야 합니다.\n(예: 1d100, d10)");
                return;
            }

            diceInputStr = rawInput;

            let mathExpression = rawInput.replace(/(\d*)d(\d+)/gi, function(match, numDice, sides) {
                let count = numDice ? parseInt(numDice) : 1;
                let max = parseInt(sides);
                let sum = 0;
                for(let i = 0; i < count; i++) {
                    sum += Math.floor(Math.random() * max) + 1;
                }
                return sum;
            });

            try {
                currentResult = Math.floor(new Function('return ' + mathExpression)());
            } catch (e) {
                alert("수식 계산 오류: 입력하신 계산식에 문제가 있습니다.");
                return;
            }

            document.getElementById('dice-result').innerText = currentResult;
            
            currentTargetValue = document.getElementById('target-value').value;
            let judgmentResultElement = document.getElementById('judgment-result');
            
            const isTimeChecked = document.getElementById('show-time-chk').checked;
            rolledTimeText = isTimeChecked ? getFormattedTime() : '';

            let diceMatch = rawInput.match(/d(\d+)/i);
            if (diceMatch) {
                maxDice = parseInt(diceMatch[1]);
            } else {
                maxDice = 100;
            }

            if (maxDice === 100 && currentTargetValue) {
                let target = parseInt(currentTargetValue);

                if (currentResult === 1) {
                    judgmentText = '대성공';
                    judgmentResultElement.style.color = '#2563eb'; 
                } else if (currentResult >= 100) {
                    judgmentText = '대실패';
                    judgmentResultElement.style.color = '#dc2626'; 
                } else if (target <= 50 && currentResult >= 96) {
                    judgmentText = '대실패';
                    judgmentResultElement.style.color = '#dc2626'; 
                } else if (currentResult <= target / 5) {
                    judgmentText = '극단적 성공';
                    judgmentResultElement.style.color = '#2563eb'; 
                } else if (currentResult <= target / 2) {
                    judgmentText = '어려운 성공';
                    judgmentResultElement.style.color = '#2563eb'; 
                } else if (currentResult <= target) {
                    judgmentText = '성공';
                    judgmentResultElement.style.color = '#2563eb'; 
                } else {
                    judgmentText = '실패';
                    judgmentResultElement.style.color = '#dc2626'; 
                }
                judgmentResultElement.innerHTML = `판정 결과: [ ${judgmentText} ]`;
            } else {
                if (currentTargetValue) {
                    let target = parseInt(currentTargetValue);
                    if (currentResult <= target) {
                        judgmentText = '성공';
                        judgmentResultElement.style.color = '#2563eb';
                    } else {
                        judgmentText = '실패';
                        judgmentResultElement.style.color = '#dc2626';
                    }
                    judgmentResultElement.innerHTML = `판정 결과: [ ${judgmentText} ]`;
                } else {
                    judgmentText = '단순 굴림';
                    judgmentResultElement.innerHTML = `단순 굴림 완료`;
                    judgmentResultElement.style.color = '#555';
                }
            }

            if (rolledTimeText) {
                judgmentResultElement.innerHTML += `<br><span style="font-size: 0.9rem; color: #888; font-weight: normal;">⏱️ ${rolledTimeText}</span>`;
            }
            
            document.getElementById('copy-result-btn').style.display = 'block';
            document.getElementById('kakao-share-btn').style.display = 'block';
        }

        function copyResultText() {
            let targetDisplay = currentTargetValue ? currentTargetValue : '미입력';
            let textToCopy = `🎲 ${diceInputStr} 굴림: [ ${judgmentText} ]\n주사위수: ${currentResult} (판정기준: ${targetDisplay})`;
            
            if (rolledTimeText) {
                textToCopy += `\n⏱️ ${rolledTimeText}`;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('결과가 클립보드에 복사되었습니다!');
            }).catch(err => {
                alert('복사에 실패했습니다.');
            });
        }

        function shareToKakao() {
            let targetDisplay = currentTargetValue ? currentTargetValue : '미입력';
            let descriptionString = `주사위수: ${currentResult} (판정기준: ${targetDisplay})`;
            if (rolledTimeText) {
                descriptionString += `\n⏱️ ${rolledTimeText}`;
            }

            Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                    title: `🎲 ${diceInputStr} 굴림: [ ${judgmentText} ]`,
                    description: descriptionString,
                    link: {
                        mobileWebUrl: 'https://nope-903.github.io/dice',
                        webUrl: 'https://nope-903.github.io/dice',
                    },
                },
                buttons: [
                    {
                        title: '나도 주사위 굴리기',
                        link: {
                            mobileWebUrl: 'https://nope-903.github.io/dice',
                            webUrl: 'https://nope-903.github.io/dice',
                        },
                    },
                ],
            });
        }
    </script>
</body>
</html>
